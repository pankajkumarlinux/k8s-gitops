name: Build & Push Image

on:
  push:
    branches: [ main ]
    paths:
      - 'web-app/**'
      - 'Dockerfile'

jobs:
  build:
    if: github.acton != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push
      run: |
        IMAGE=${{ secrets.DOCKERHUB_USER }}/frontend:${{ github.sha }}
        docker build -t $IMAGE ./web-app
        docker build -t pankajkumarlinux/frontend:dev ./web-app
        docker push pankajkumarlinux/frontend:dev
        docker push $IMAGE
    - name: Update GitOps Repo
      run: |
        git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/pankajkumarlinux/k8s-gitops.git
        cd k8s-gitops
        sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" charts/frontend/values.yaml
        git config user.email "ci@github.com"
        git config user.name "github-actions"
        git add .
        git commit -m "Update frontend image to ${{ github.sha }}"
        git push